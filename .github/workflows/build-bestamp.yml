name: Build BestAmp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure machine
      run: |
        Write-Host "installing make"
        pacman -S make
    - name: make
      run: |
        Write-Host "building BestAmp"
        make
